<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éditeur de Grilles 7x5 (A4)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-area, #printable-area * {
                visibility: visible;
            }
            #printable-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 210mm;
                height: 297mm;
                margin: 0 auto;
                padding: 8mm 12mm;
                background: white;
                display: flex;
                flex-direction: column;
                justify-content: space-around;
                align-items: center;
                box-sizing: border-box;
            }
            .no-print {
                display: none !important;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
            .grid-container {
                page-break-inside: avoid;
                break-inside: avoid;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col" x-data="gridApp()">

    <header class="bg-white shadow-sm border-b border-slate-200 no-print">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                    <span class="bg-indigo-600 text-white p-2 rounded-xl text-lg">🔲</span>
                    Générateur de Grilles 7x5
                </h1>
                <p class="text-sm text-slate-500">Créez, éditez et imprimez vos deux grilles au format A4 avec couleurs individuelles par lettre.</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <button @click="loadSampleData()" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl text-sm transition border border-slate-300">
                    Exemples d'origine
                </button>
                <button @click="clearAllGrids()" class="px-4 py-2 bg-amber-50 hover:bg-amber-100 text-amber-800 font-semibold rounded-xl text-sm transition border border-amber-300 flex items-center gap-1.5 shadow-xs">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    Vider les 2 grilles (Blanches)
                </button>
                <button @click="printA4()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition shadow-md flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Imprimer en PDF (A4)
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-8" id="printable-area">
        
        <!-- Loop over 2 grids -->
        <template x-for="(grid, gIndex) in grids" :key="gIndex">
            <div class="grid-container bg-white p-6 rounded-2xl shadow-md border border-slate-200 w-full flex flex-col items-center gap-5">
                
                <!-- Grid header -->
                <div class="w-full flex justify-between items-center border-b border-slate-100 pb-3">
                    <h2 class="text-lg font-bold text-slate-800 uppercase tracking-wide" x-text="`GRILLE ${gIndex + 1}`"></h2>
                    <div class="flex items-center gap-3 no-print">
                        <span class="text-xs font-medium text-slate-400">7 colonnes × 5 lignes</span>
                        <button 
                            @click="clearSingleGrid(gIndex)" 
                            class="px-3 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 font-medium rounded-lg text-xs transition border border-amber-200 flex items-center gap-1"
                            title="Réinitialise toutes les cases de cette grille en blanc"
                        >
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            Vider cette grille
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-7 gap-2 w-full max-w-lg aspect-[7/5]">
                    <template x-for="(cell, cIndex) in grid.cells" :key="cIndex">
                        <div 
                            @click="selectCell(gIndex, cIndex)"
                            :class="{
                                'bg-black text-white': cell.isBlackFill,
                                'bg-white border-slate-300 hover:border-indigo-400': !cell.isBlackFill,
                                'ring-2 ring-indigo-600 border-indigo-600 z-10 shadow-md': selectedGrid === gIndex && selectedCell === cIndex
                            }"
                            class="border-2 rounded-lg flex items-center justify-center font-bold text-base sm:text-2xl cursor-pointer transition select-none aspect-square uppercase tracking-normal"
                        >
                            <template x-if="!cell.isBlackFill">
                                <div class="flex items-center justify-center">
                                    <template x-for="item in cell.letters">
                                        <span :class="item.color === 'gray' ? 'text-slate-400' : 'text-slate-900'" x-text="item.char"></span>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>

                <div class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 no-print" x-data="{ open: false }" x-effect="if (selectedGrid === gIndex) open = true">
                    <div class="flex justify-between items-center cursor-pointer" @click="open = !open">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-semibold text-slate-700" x-text="selectedGrid === gIndex && selectedCell !== null ? `Édition : Case ${selectedCell + 1}` : `Panneau d'édition - Grille ${gIndex + 1}`"></span>
                            <span class="text-xs px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded-full font-bold" x-show="selectedGrid === gIndex && selectedCell !== null" x-text="getCellDisplayString(activeCell)"></span>
                        </div>
                        <button class="text-slate-400 hover:text-slate-600 text-sm font-medium flex items-center gap-1">
                            <span x-text="open ? 'Replier' : 'Déplier'"></span>
                            <svg class="w-4 h-4 transform transition-transform" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                    </div>

                    <!-- Retractable Panel Content -->
                    <div x-show="open" x-transition class="mt-4 pt-4 border-t border-slate-200 space-y-4">
                        <div x-show="selectedGrid === gIndex && selectedCell !== null" class="space-y-4">
                            
                            <!-- Detailed letter slots (1-3 letters) with individual color controls -->
                            <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-semibold text-slate-700 uppercase tracking-wide">Saisie lettre par lettre (1 à 3) & Couleurs</span>
                                    <button @click="clearActiveCell()" class="text-xs text-rose-600 hover:underline font-medium flex items-center gap-1">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                        Effacer cette case
                                    </button>
                                </div>
                                
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <template x-for="(slotIndex) in [0, 1, 2]" :key="slotIndex">
                                        <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 flex flex-col gap-2">
                                            <div class="flex justify-between items-center">
                                                <span class="text-xs font-medium text-slate-500" x-text="`Lettre ${slotIndex + 1}`"></span>
                                                <div class="flex rounded-md overflow-hidden border border-slate-300 text-[10px]">
                                                    <button 
                                                        @click="setLetterColor(slotIndex, 'black')" 
                                                        :class="getLetterColor(slotIndex) === 'black' ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 hover:bg-slate-100'"
                                                        class="px-2 py-0.5 font-semibold transition"
                                                    >Noir</button>
                                                    <button 
                                                        @click="setLetterColor(slotIndex, 'gray')" 
                                                        :class="getLetterColor(slotIndex) === 'gray' ? 'bg-slate-400 text-white' : 'bg-white text-slate-600 hover:bg-slate-100'"
                                                        class="px-2 py-0.5 font-semibold transition"
                                                    >Gris</button>
                                                </div>
                                            </div>
                                            <input 
                                                type="text" 
                                                maxlength="1" 
                                                :value="getLetterChar(slotIndex)"
                                                @input="updateLetterChar(slotIndex, $event.target.value)"
                                                :class="getLetterColor(slotIndex) === 'gray' ? 'text-slate-400 border-slate-300' : 'text-slate-900 border-slate-400'"
                                                class="w-full h-12 bg-white border-2 rounded-lg text-center font-bold text-2xl uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500 transition shadow-inner"
                                                placeholder="-"
                                            >
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <div>
                                <span class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-2">Palette d'insertion rapide :</span>
                                <div class="flex flex-wrap gap-2">
                                    <!-- Highlighted Dotted I (İ) button -->
                                    <button 
                                        @click="appendSpecialChar('İ')" 
                                        class="w-12 h-12 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-2xl rounded-xl transition shadow-md border-2 border-indigo-700 flex items-center justify-center"
                                        title="Insérer İ (I majuscule avec point)"
                                    >
                                        İ
                                    </button>

                                    <!-- Accented Capital Variations Palette (WITHOUT standard 'I') -->
                                    <template x-for="char in specialChars" :key="char">
                                        <button 
                                            @click="appendSpecialChar(char)" 
                                            class="w-12 h-12 bg-white hover:bg-indigo-50 hover:text-indigo-600 text-slate-800 font-bold text-xl rounded-xl transition border border-slate-300 shadow-sm flex items-center justify-center active:scale-95"
                                            x-text="char"
                                        ></button>
                                    </template>
                                </div>
                            </div>

                            <!-- Black cell toggle option -->
                            <div>
                                <button 
                                    @click="toggleBlackFill()"
                                    :class="activeCell.isBlackFill ? 'bg-slate-900 text-white border-slate-900 ring-2 ring-slate-900' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-100'"
                                    class="w-full py-2.5 px-3 border rounded-xl font-medium text-xs transition flex items-center justify-center gap-1.5 shadow-sm"
                                >
                                    <span class="w-3 h-3 rounded border border-slate-400" :class="activeCell.isBlackFill ? 'bg-white' : 'bg-black'"></span>
                                    <span x-text="activeCell.isBlackFill ? 'Case Noire (Cliquer pour repasser en blanc)' : 'Remplir la case en noir'"></span>
                                </button>
                            </div>

                            <!-- Quick cell navigation -->
                            <div class="pt-2 flex justify-between items-center text-xs">
                                <button @click="navigateCell(-1)" class="px-3 py-1.5 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 rounded-lg font-medium transition shadow-xs">← Case précédente</button>
                                <span class="text-slate-400" x-text="`Case ${selectedCell + 1} / 35`"></span>
                                <button @click="navigateCell(1)" class="px-3 py-1.5 bg-indigo-50 border border-indigo-200 hover:bg-indigo-100 text-indigo-700 rounded-lg font-medium transition shadow-xs">Case suivante →</button>
                            </div>
                        </div>

                        <!-- Prompt when no cell is selected in this grid -->
                        <div x-show="selectedGrid !== gIndex || selectedCell === null" class="py-4 text-center text-slate-400 text-sm">
                            👆 Cliquez sur une case de la <span x-text="`Grille ${gIndex + 1}`"></span> ci-dessus pour modifier son contenu.
                        </div>
                    </div>
                </div>

            </div>
        </template>

    </main>

    <script>
        function createEmptyGrid() {
            let cells = [];
            for (let i = 0; i < 35; i++) {
                cells.push({ letters: [], isBlackFill: false });
            }
            return { cells };
        }

        function parseTextToLetters(text, existingLetters = []) {
            let chars = text.toUpperCase().slice(0, 3).split('');
            return chars.map((char, index) => {
                let existingColor = existingLetters[index] ? existingLetters[index].color : 'black';
                return { char: char, color: existingColor };
            });
        }

        function gridApp() {
            return {
                grids: [
                    createEmptyGrid(),
                    createEmptyGrid()
                ],
                selectedGrid: null,
                selectedCell: null,
                activeCell: { letters: [], isBlackFill: false },
                
                // Common accented capital letters (excl. standard 'I')
                specialChars: ['É', 'È', 'Ê', 'Ë', 'À', 'Â', 'Î', 'Ï', 'Ô', 'Ö', 'Ù', 'Û', 'Ü', 'Ç', 'Æ', 'Œ'],

                init() {
                    this.loadSampleData();
                },

                selectCell(gIndex, cIndex) {
                    this.selectedGrid = gIndex;
                    this.selectedCell = cIndex;
                    this.activeCell = this.grids[gIndex].cells[cIndex];
                },

                getLetterChar(slotIndex) {
                    return this.activeCell.letters[slotIndex] ? this.activeCell.letters[slotIndex].char : '';
                },

                getLetterColor(slotIndex) {
                    return this.activeCell.letters[slotIndex] ? this.activeCell.letters[slotIndex].color : 'black';
                },

                updateLetterChar(slotIndex, val) {
                    if (this.selectedGrid === null || this.selectedCell === null) return;
                    let char = val.toUpperCase().slice(0, 1);
                    
                    while (this.activeCell.letters.length <= slotIndex) {
                        this.activeCell.letters.push({ char: '', color: 'black' });
                    }

                    if (char === '') {
                        this.activeCell.letters[slotIndex].char = '';
                        while (this.activeCell.letters.length > 0 && this.activeCell.letters[this.activeCell.letters.length - 1].char === '') {
                            this.activeCell.letters.pop();
                        }
                    } else {
                        this.activeCell.letters[slotIndex].char = char;
                    }
                    this.activeCell.isBlackFill = false;
                    this.saveActiveCell();
                },

                setLetterColor(slotIndex, color) {
                    if (this.selectedGrid === null || this.selectedCell === null) return;
                    if (this.activeCell.letters[slotIndex]) {
                        this.activeCell.letters[slotIndex].color = color;
                        this.saveActiveCell();
                    }
                },

                appendSpecialChar(char) {
                    if (this.selectedGrid === null || this.selectedCell === null) return;
                    if (this.activeCell.letters.length < 3) {
                        this.activeCell.letters.push({ char: char, color: 'black' });
                        this.activeCell.isBlackFill = false;
                        this.saveActiveCell();
                    } else {
                        let emptyIdx = this.activeCell.letters.findIndex(l => l.char === '');
                        if (emptyIdx !== -1) {
                            this.activeCell.letters[emptyIdx].char = char;
                        } else {
                            this.activeCell.letters[2].char = char;
                        }
                        this.saveActiveCell();
                    }
                },

                clearActiveCell() {
                    if (this.selectedGrid !== null && this.selectedCell !== null) {
                        this.activeCell.letters = [];
                        this.activeCell.isBlackFill = false;
                        this.saveActiveCell();
                    }
                },

                toggleBlackFill() {
                    this.activeCell.isBlackFill = !this.activeCell.isBlackFill;
                    if (this.activeCell.isBlackFill) {
                        this.activeCell.letters = [];
                    }
                    this.saveActiveCell();
                },

                saveActiveCell() {
                    if (this.selectedGrid !== null && this.selectedCell !== null) {
                        this.grids[this.selectedGrid].cells[this.selectedCell] = JSON.parse(JSON.stringify(this.activeCell));
                    }
                },

                getCellDisplayString(cell) {
                    if (cell.isBlackFill) return 'Noire';
                    if (!cell.letters || cell.letters.length === 0) return 'Vide';
                    return cell.letters.map(l => l.char).join('');
                },

                navigateCell(direction) {
                    if (this.selectedGrid === null || this.selectedCell === null) return;
                    
                    let newCellIndex = this.selectedCell + direction;
                    let newGridIndex = this.selectedGrid;

                    if (newCellIndex > 34) {
                        newCellIndex = 0;
                        newGridIndex = (newGridIndex + 1) % this.grids.length;
                    } else if (newCellIndex < 0) {
                        newCellIndex = 34;
                        newGridIndex = (newGridIndex - 1 + this.grids.length) % this.grids.length;
                    }

                    this.selectCell(newGridIndex, newCellIndex);
                },

                clearSingleGrid(gIndex) {
                    this.grids[gIndex] = createEmptyGrid();
                    if (this.selectedGrid === gIndex) {
                        this.selectedCell = null;
                        this.activeCell = { letters: [], isBlackFill: false };
                    }
                },

                clearAllGrids() {
                    this.grids = [createEmptyGrid(), createEmptyGrid()];
                    this.selectedGrid = null;
                    this.selectedCell = null;
                    this.activeCell = { letters: [], isBlackFill: false };
                },

                loadSampleData() {
                    const rawGrid1 = [
                        "Mİ", "Dİ", "", "Pİ", "LO", "TE", "",
                        "TU", "Lİ", "PE", "", "DO", "Mİ", "NO",
                        "Lİ", "MO", "NA", "DE", "", "CA", "FÉ",
                        "TÉ", "LÉ", "", "BA", "NA", "NE", "",
                        "PO", "Lİ", "CE", "", "RA", "DİS", ""
                    ];

                    const rawGrid2 = [
                        "MO", "TO", "", "TO", "MA", "TE", "",
                        "LA", "VA", "BO", "", "Gİ", "RA", "FE",
                        "MA", "GA", "Zİ", "NE", "", "BÉ", "BÉ",
                        "TA", "PİS", "", "TÉ", "Tİ", "NE", "",
                        "Sİ", "RÈ", "NE", "", "RO", "BOT", ""
                    ];

                    const populateGrid = (rawArray) => {
                        let cells = [];
                        for (let i = 0; i < 35; i++) {
                            let val = rawArray[i] || '';
                            cells.push({
                                letters: parseTextToLetters(val),
                                isBlackFill: val === ''
                            });
                        }
                        return { cells };
                    };

                    this.grids = [
                        populateGrid(rawGrid1),
                        populateGrid(rawGrid2)
                    ];
                    this.selectedGrid = null;
                    this.selectedCell = null;
                },

                printA4() {
                    window.print();
                }
            }
        }
    </script>
</body>
</html>
